<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محرك البحث الذكي للحجاج</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #0D3B2E;
  --primary-mid: #1A5C43;
  --primary-light: #2E7D5A;
  --accent: #C9A84C;
  --accent-light: #E8C97A;
  --accent-dark: #8B6914;
  --bg: #FDF6E3;
  --bg-dark: #F0E6C8;
  --white: #ffffff;
  --text: #1a1a1a;
  --text-mid: #3a3a3a;
  --emergency: #c0392b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Tajawal',sans-serif; background:var(--primary); color:var(--text); min-height:100vh; direction:rtl; }

/* ===== ADMIN PANEL ===== */
#adminPanel {
  position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999;
  overflow-y:auto; display:none;
}
#adminPanel.open { display:block; }
.admin-container {
  background:#1a1a2e; min-height:100vh; max-width:700px; margin:0 auto;
  padding:20px;
}
.admin-header {
  background:linear-gradient(135deg,var(--primary),var(--primary-mid));
  border:2px solid var(--accent); border-radius:16px; padding:16px 20px;
  margin-bottom:20px; display:flex; align-items:center; justify-content:space-between;
}
.admin-header h2 { color:var(--accent-light); font-size:18px; font-weight:800; }
.admin-close {
  background:var(--accent); color:var(--primary); border:none;
  padding:8px 16px; border-radius:20px; font-size:13px; font-weight:700;
  cursor:pointer; font-family:'Tajawal',sans-serif;
}

.admin-tabs {
  display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;
}
.admin-tab {
  padding:8px 14px; border:1.5px solid rgba(201,168,76,0.3);
  background:transparent; color:rgba(255,255,255,0.6); border-radius:20px;
  font-size:12px; cursor:pointer; font-family:'Tajawal',sans-serif;
  transition:all 0.2s;
}
.admin-tab.active {
  background:var(--accent); color:var(--primary); border-color:var(--accent); font-weight:700;
}

.admin-section { display:none; }
.admin-section.active { display:block; }

.admin-group {
  background:#0f0f1e; border:1px solid rgba(201,168,76,0.2);
  border-radius:14px; padding:16px; margin-bottom:12px;
}
.admin-group h3 {
  color:var(--accent-light); font-size:14px; font-weight:700;
  margin-bottom:12px; padding-bottom:8px;
  border-bottom:1px solid rgba(201,168,76,0.2);
}
.admin-field { margin-bottom:12px; }
.admin-field label {
  display:block; color:rgba(255,255,255,0.7); font-size:12px;
  margin-bottom:4px; font-weight:500;
}
.admin-field input, .admin-field textarea, .admin-field select {
  width:100%; background:#1a1a2e; border:1.5px solid rgba(201,168,76,0.3);
  border-radius:8px; padding:9px 12px; color:white; font-family:'Tajawal',sans-serif;
  font-size:13px; outline:none; transition:border-color 0.2s;
}
.admin-field input:focus, .admin-field textarea:focus {
  border-color:var(--accent);
}
.admin-field input[type="color"] {
  height:40px; padding:4px 8px; cursor:pointer;
}
.admin-field textarea { resize:vertical; min-height:80px; }
.color-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.admin-save-btn {
  width:100%; background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:var(--primary); border:none; padding:14px; border-radius:12px;
  font-size:16px; font-weight:800; cursor:pointer; font-family:'Tajawal',sans-serif;
  margin-top:8px; transition:opacity 0.2s;
}
.admin-save-btn:hover { opacity:0.9; }

/* Category order drag */
.cat-order-list { list-style:none; }
.cat-order-item {
  background:#1a1a2e; border:1px solid rgba(201,168,76,0.2);
  border-radius:10px; padding:10px 14px; margin-bottom:8px;
  display:flex; align-items:center; gap:10px; cursor:grab;
  color:white; font-size:13px; user-select:none;
}
.cat-order-item:active { cursor:grabbing; opacity:0.7; }
.drag-handle { color:var(--accent); font-size:18px; }
.cat-order-item .cat-vis-toggle {
  margin-right:auto; margin-left:0;
  background:none; border:1.5px solid rgba(201,168,76,0.4);
  color:rgba(255,255,255,0.6); border-radius:6px; padding:3px 10px;
  font-size:11px; cursor:pointer; font-family:'Tajawal',sans-serif;
}
.cat-order-item .cat-vis-toggle.visible {
  background:var(--accent); color:var(--primary); border-color:var(--accent); font-weight:700;
}

/* reset btn */
.admin-reset-btn {
  background:transparent; border:1.5px solid #e74c3c; color:#e74c3c;
  padding:8px 16px; border-radius:10px; font-size:12px; cursor:pointer;
  font-family:'Tajawal',sans-serif; margin-top:8px;
}

/* ===== MAIN SITE ===== */
.header {
  padding:24px 20px 20px; text-align:center; position:relative;
  border-bottom:3px solid var(--accent); overflow:hidden;
}
.header::before {
  content:''; position:absolute; inset:0;
  background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23C9A84C' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events:none;
}
.logo-area { display:none; 
}
.header-titles h1 { font-family:'Amiri',serif; font-size:22px; font-weight:700; line-height:1.3; }
.header-titles p { font-size:13px; margin-top:4px; font-weight:300; opacity:0.8; }
.company-badge {
  display:inline-block; border:1px solid rgba(201,168,76,0.4);
  font-size:12px; padding:4px 14px; border-radius:20px; margin-top:8px;
}

.lang-toggle { position:absolute; top:16px; left:16px; display:flex; gap:4px; }
.lang-btn {
  padding:5px 12px; border:1px solid rgba(201,168,76,0.5); background:transparent;
  border-radius:16px; font-size:12px; cursor:pointer; font-family:'Tajawal',sans-serif; transition:all 0.2s;
}
.lang-btn.active { font-weight:700; border-color:var(--accent); }

/* Admin trigger */
.admin-trigger {
  position:absolute; top:16px; right:16px;
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
  color:white; padding:6px 12px; border-radius:16px;
  font-size:11px; cursor:pointer; font-family:'Tajawal',sans-serif;
}

/* Search */
.search-section { padding:20px 16px; border-bottom:2px solid; }
.search-box { position:relative; max-width:600px; margin:0 auto; }
.search-input {
  width:100%; padding:14px 50px 14px 50px; border:2px solid var(--accent);
  border-radius:50px; font-size:15px; font-family:'Tajawal',sans-serif;
  background:white; outline:none; color:var(--text); transition:box-shadow 0.2s; direction:rtl;
}
.search-input:focus { box-shadow:0 0 0 3px rgba(201,168,76,0.25); }
.search-icon { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:20px; color:var(--accent-dark); }
.search-clear {
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  font-size:18px; color:#999; cursor:pointer; display:none; background:none; border:none;
}
.suggestions-box {
  position:absolute; top:calc(100% + 6px); right:0; left:0;
  background:white; border:1.5px solid var(--accent); border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.12); z-index:100; overflow:hidden; display:none;
}
.suggestion-item {
  padding:12px 18px; cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; gap:10px;
  border-bottom:1px solid #f0f0f0; transition:background 0.15s;
}
.suggestion-item:last-child { border-bottom:none; }
.suggestion-item:hover { background:var(--bg); }
.suggestion-item .s-cat { font-size:11px; color:var(--primary-mid); font-weight:600; margin-right:auto; }

/* Main */
.main { padding:16px; max-width:700px; margin:0 auto; }
.section-label { font-size:13px; font-weight:600; margin-bottom:10px; margin-top:16px; display:flex; align-items:center; gap:8px; letter-spacing:0.5px; }
.section-label::after { content:''; flex:1; height:1px; background:rgba(201,168,76,0.3); }

.emergency-bar {
  border-radius:14px; padding:12px 16px; display:flex; align-items:center;
  gap:12px; cursor:pointer; transition:opacity 0.2s; margin-top:4px;
}
.emergency-bar:hover { opacity:0.9; }
.emergency-bar .e-icon { font-size:24px; }
.emergency-bar .e-text h3 { color:white; font-size:14px; font-weight:700; }
.emergency-bar .e-text p { color:rgba(255,255,255,0.85); font-size:12px; }
.emergency-bar .e-arrow { margin-right:auto; color:white; font-size:20px; }

.categories-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.cat-card {
  background:var(--bg); border-radius:16px; overflow:hidden; cursor:pointer;
  transition:transform 0.2s, box-shadow 0.2s; border:1.5px solid transparent;
}
.cat-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.15); }
.cat-header { padding:14px 14px 10px; display:flex; align-items:center; gap:10px; }
.cat-icon-wrap { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
.cat-title { font-size:14px; font-weight:700; color:var(--text); line-height:1.3; }
.cat-subtitle { font-size:11px; color:#666; margin-top:2px; }
.cat-preview { background:rgba(0,0,0,0.03); padding:8px 14px 12px; font-size:12px; color:#555; line-height:1.6; border-top:1px solid rgba(0,0,0,0.05); }

/* Detail */
.detail-panel { display:none; background:var(--bg); border-radius:20px; overflow:hidden; }
.detail-panel.active { display:block; }
.edit-mode-bar {
  padding:10px 16px; display:flex; align-items:center; justify-content:space-between;
}
.edit-mode-bar span { font-size:13px; font-weight:600; }
.toggle-edit-btn {
  border:none; padding:7px 16px; border-radius:20px; font-size:13px;
  font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;
  display:flex; align-items:center; gap:6px; transition:opacity 0.2s;
}
.save-btn {
  border:none; padding:7px 16px; border-radius:20px; font-size:13px;
  font-weight:700; cursor:pointer; font-family:'Tajawal',sans-serif;
  display:none; align-items:center; gap:6px; background:#2E7D5A; color:white;
}
.save-btn.show { display:flex; }
.detail-top {
  padding:16px; display:flex; align-items:center; gap:12px;
  border-bottom:2px solid var(--bg-dark);
}
.back-btn {
  border:none; padding:8px 14px; border-radius:20px;
  font-size:13px; cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:600;
}
.detail-top h2 { font-size:18px; font-weight:800; }
.detail-body { padding:16px; }
.info-item {
  background:white; border-radius:14px; padding:14px 16px; margin-bottom:10px;
  border-right:4px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.info-item h3 { font-size:14px; font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.info-item p { font-size:13px; color:var(--text-mid); line-height:1.8; }
.editable-field {
  background:var(--bg); border:1.5px dashed var(--accent); border-radius:8px;
  padding:8px 12px; font-size:13px; color:var(--text-mid); width:100%;
  font-family:'Tajawal',sans-serif; margin-top:6px; outline:none; resize:none; min-height:36px;
}
.editable-field:focus { border-style:solid; background:white; }
.edit-hint { font-size:11px; color:var(--accent-dark); margin-top:4px; }

.footer { text-align:center; padding:20px; font-size:11px; opacity:0.5; }

body.en { direction:ltr; }
body.en .search-input { direction:ltr; }
body.en .info-item { border-right:none; border-left:4px solid var(--accent); }
body.en .suggestion-item .s-cat { margin-right:0; margin-left:auto; }
body.en .emergency-bar .e-arrow { margin-right:0; margin-left:auto; }
body.en .lang-toggle { left:auto; right:16px; }
body.en .admin-trigger { right:auto; left:16px; }

@media(max-width:400px) { .categories-grid { grid-template-columns:1fr; } .header-titles h1 { font-size:18px; } }

/* حماية التعديل: لا تظهر أدوات التعديل للزوار */
body:not(.admin-unlocked) #editModeBar { display:none !important; }
body:not(.admin-unlocked) .editable-field { pointer-events:none !important; }

</style>
</head>
<body>

<!-- ===== ADMIN PANEL ===== -->
<div id="adminPanel">
<div class="admin-container">
  <div class="admin-header">
    <h2>⚙️ لوحة التحكم الكاملة</h2>
    <button class="admin-close" onclick="closeAdmin()">✓ حفظ وإغلاق</button>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchTab('tab-site')">🎨 الموقع العام</button>
    <button class="admin-tab" onclick="switchTab('tab-header')">🏷️ الرأس والشعار</button>
    <button class="admin-tab" onclick="switchTab('tab-colors')">🎨 الألوان</button>
    <button class="admin-tab" onclick="switchTab('tab-cats')">📂 الأقسام</button>
    <button class="admin-tab" onclick="switchTab('tab-emergency')">🚨 شريط الطوارئ</button>
  </div>

  <!-- TAB: SITE -->
  <div class="admin-section active" id="tab-site">
    <div class="admin-group">
      <h3>⚙️ إعدادات عامة</h3>
      <div class="admin-field"><label>اسم الشركة / الحملة</label><input id="cfg-company" type="text"></div>
      <div class="admin-field"><label>نص الشعار (أيقونة)</label><input id="cfg-logo-icon" type="text" placeholder="مثال: 🕌"></div>
      <div class="admin-field"><label>نص الفوتر (أسفل الصفحة)</label><input id="cfg-footer" type="text"></div>
      <div class="admin-field"><label>لغة الافتراضية</label>
        <select id="cfg-default-lang">
          <option value="ar">عربي</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
    <div class="admin-group">
      <h3>🔍 البحث</h3>
      <div class="admin-field"><label>نص placeholder البحث (عربي)</label><input id="cfg-search-ar" type="text"></div>
      <div class="admin-field"><label>نص placeholder البحث (إنجليزي)</label><input id="cfg-search-en" type="text"></div>
    </div>
  </div>

  <!-- TAB: HEADER -->
  <div class="admin-section" id="tab-header">
    <div class="admin-group">
      <h3>🏷️ العنوان الرئيسي</h3>
      <div class="admin-field"><label>العنوان الكبير (عربي)</label><textarea id="cfg-title-ar"></textarea></div>
      <div class="admin-field"><label>العنوان الكبير (إنجليزي)</label><textarea id="cfg-title-en"></textarea></div>
      <div class="admin-field"><label>العنوان الفرعي (عربي)</label><input id="cfg-subtitle-ar" type="text"></div>
      <div class="admin-field"><label>العنوان الفرعي (إنجليزي)</label><input id="cfg-subtitle-en" type="text"></div>
    </div>
    <div class="admin-group">
      <h3>🏅 شعار القسم الرئيسي</h3>
      <div class="admin-field"><label>تسمية الشعار (عربي)</label><input id="cfg-cats-label-ar" type="text"></div>
      <div class="admin-field"><label>تسمية الشعار (إنجليزي)</label><input id="cfg-cats-label-en" type="text"></div>
    </div>
  </div>

  <!-- TAB: COLORS -->
  <div class="admin-section" id="tab-colors">
    <div class="admin-group">
      <h3>🎨 ألوان الموقع</h3>
      <div class="color-row">
        <div class="admin-field"><label>لون الخلفية الرئيسية (Header/Footer)</label><input id="clr-primary" type="color"></div>
        <div class="admin-field"><label>لون ثانوي</label><input id="clr-primary-mid" type="color"></div>
      </div>
      <div class="color-row">
        <div class="admin-field"><label>لون التمييز (Accent)</label><input id="clr-accent" type="color"></div>
        <div class="admin-field"><label>لون التمييز الفاتح</label><input id="clr-accent-light" type="color"></div>
      </div>
      <div class="color-row">
        <div class="admin-field"><label>لون خلفية البطاقات</label><input id="clr-bg" type="color"></div>
        <div class="admin-field"><label>لون خلفية البحث</label><input id="clr-search-bg" type="color"></div>
      </div>
      <div class="color-row">
        <div class="admin-field"><label>لون شريط الطوارئ</label><input id="clr-emergency" type="color"></div>
        <div class="admin-field"><label>لون النصوص</label><input id="clr-text" type="color"></div>
      </div>
    </div>
    <div class="admin-group">
      <h3>🔠 الخطوط</h3>
      <div class="admin-field"><label>حجم العنوان الرئيسي (px)</label><input id="cfg-title-size" type="number" min="14" max="40"></div>
      <div class="admin-field"><label>حجم خط البطاقات (px)</label><input id="cfg-card-size" type="number" min="10" max="22"></div>
    </div>
    <button class="admin-reset-btn" onclick="resetColors()">↺ إعادة الألوان الافتراضية</button>
  </div>

  <!-- TAB: CATEGORIES -->
  <div class="admin-section" id="tab-cats">
    <div class="admin-group">
      <h3>📂 ترتيب الأقسام وإظهارها</h3>
      <p style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:10px;">اسحب للترتيب • اضغط "ظاهر/مخفي" للتحكم</p>
      <ul class="cat-order-list" id="catOrderList"></ul>
    </div>
    <div class="admin-group" id="catEditArea">
      <h3>✏️ تعديل محتوى القسم</h3>
      <div class="admin-field"><label>اختر القسم</label>
        <select id="catEditSelect" onchange="loadCatEdit()">
          <option value="">-- اختر --</option>
        </select>
      </div>
      <div id="catEditFields"></div>
    </div>
  </div>

  <!-- TAB: EMERGENCY -->
  <div class="admin-section" id="tab-emergency">
    <div class="admin-group">
      <h3>🚨 شريط الطوارئ السريع</h3>
      <div class="admin-field"><label>إظهار الشريط</label>
        <select id="cfg-emg-show"><option value="yes">ظاهر</option><option value="no">مخفي</option></select>
      </div>
      <div class="admin-field"><label>أيقونة الشريط</label><input id="cfg-emg-icon" type="text" placeholder="🚨"></div>
      <div class="admin-field"><label>عنوان الشريط (عربي)</label><input id="cfg-emg-title-ar" type="text"></div>
      <div class="admin-field"><label>نص الشريط (عربي)</label><input id="cfg-emg-sub-ar" type="text"></div>
      <div class="admin-field"><label>عنوان الشريط (إنجليزي)</label><input id="cfg-emg-title-en" type="text"></div>
      <div class="admin-field"><label>نص الشريط (إنجليزي)</label><input id="cfg-emg-sub-en" type="text"></div>
      <div class="admin-field"><label>يفتح قسم</label>
        <select id="cfg-emg-target"></select>
      </div>
    </div>
  </div>

  <button class="admin-save-btn" onclick="applyAndSave()">💾 تطبيق وحفظ كل التغييرات</button>
</div>
</div>

<!-- ===== MAIN SITE ===== -->
<div class="header" id="siteHeader">
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('ar',event)">عربي</button>
    <button class="lang-btn" onclick="setLang('en',event)">EN</button>
  </div>
  <button class="admin-trigger" onclick="checkAdminPassword()">⚙️ تحكم</button>
  
  <div class="company-badge" id="companyBadge"></div>
</div>

<div class="search-section" id="searchSection">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text" oninput="handleSearch(this.value)">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    <div class="suggestions-box" id="suggestionsBox"></div>
  </div>
</div>

<div class="main">
  <div id="homeView">
    <div id="emergencyBarWrap"></div>
    <div class="section-label" id="catsLabel" style="margin-top:16px;"></div>
    <div class="categories-grid" id="catsGrid"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="edit-mode-bar" id="editModeBar">
      <span id="editModeLabel">✏️ وضع التعديل: مُغلق</span>
      <div style="display:flex;gap:8px;">
        <button class="save-btn" id="saveBtn" onclick="saveContentEdits()">💾 حفظ</button>

let cfg = {};
let cats = {};
let contentEdits = {};
let currentLang = 'ar';
let currentCat = null;
let editMode = false;

function loadState() {
  try {
    const sc = localStorage.getItem('hjCfg');
    cfg = sc ? {...DEFAULT_CFG, ...JSON.parse(sc)} : {...DEFAULT_CFG};
    const sk = localStorage.getItem('hjCats');
    cats = sk ? JSON.parse(sk) : JSON.parse(JSON.stringify(DEFAULT_CATS));
    const se = localStorage.getItem('hjEdits');
    contentEdits = se ? JSON.parse(se) : {};
  } catch(e) {
    cfg = {...DEFAULT_CFG};
    cats = JSON.parse(JSON.stringify(DEFAULT_CATS));
    contentEdits = {};
  }
}

function saveState() {
  try {
    localStorage.setItem('hjCfg', JSON.stringify(cfg));
    localStorage.setItem('hjCats', JSON.stringify(cats));
    localStorage.setItem('hjEdits', JSON.stringify(contentEdits));
  } catch(e) {}
}

// ============================================================
// APPLY CONFIG TO SITE
// ============================================================
function applyConfig() {
  const r = document.documentElement.style;
  r.setProperty('--primary', cfg.clrPrimary);
  r.setProperty('--primary-mid', cfg.clrPrimaryMid);
  r.setProperty('--accent', cfg.clrAccent);
  r.setProperty('--accent-light', cfg.clrAccentLight);
  r.setProperty('--bg', cfg.clrBg);
  r.setProperty('--emergency', cfg.clrEmergency);
  r.setProperty('--text', cfg.clrText);

  if (!document.querySelector('#logoCircle img')) document.getElementById('logoCircle').style.display = 'none';
  document.getElementById('logoCircle').style.background = `linear-gradient(135deg,${cfg.clrAccent},${cfg.clrAccentLight})`;
  document.getElementById('siteHeader').style.background = `linear-gradient(135deg,${cfg.clrPrimary},${cfg.clrPrimaryMid},${cfg.clrPrimary})`;
  document.getElementById('companyBadge').style.color = cfg.clrAccentLight;
  document.getElementById('siteFooter').style.color = cfg.clrAccentLight;

  const searchSec = document.getElementById('searchSection');
  searchSec.style.background = cfg.clrSearchBg;
  searchSec.style.borderBottomColor = cfg.clrBg;

  const editBar = document.getElementById('editModeBar');
  editBar.style.background = `linear-gradient(90deg,${cfg.clrPrimary},${cfg.clrPrimaryMid})`;
  document.getElementById('editModeLabel').style.color = cfg.clrAccentLight;
  const etBtn = document.getElementById('editToggle');
  etBtn.style.background = cfg.clrAccent;
  etBtn.style.color = cfg.clrPrimary;

  const backBtn = document.getElementById('backBtn');
  backBtn.style.background = cfg.clrPrimary;
  backBtn.style.color = cfg.clrAccentLight;

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.style.color = cfg.clrAccentLight;
  });
  document.querySelector('.lang-btn.active').style.background = cfg.clrAccent;
  document.querySelector('.lang-btn.active').style.color = cfg.clrPrimary;

  document.getElementById('mainTitle').style.color = cfg.clrAccentLight;
  document.getElementById('mainTitle').style.fontSize = cfg.titleSize + 'px';
  document.getElementById('mainSubtitle').style.color = `rgba(255,255,255,0.7)`;
  document.getElementById('companyBadge').style.background = `rgba(${hexToRgb(cfg.clrAccent)},0.15)`;

  renderText();
  renderEmergencyBar();
  renderCatsGrid();
  if (currentCat && document.getElementById('detailPanel').classList.contains('active')) {
    renderDetail(currentCat);
  }
}

function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? `${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}` : '0,0,0';
}

function renderText() {
  const ar = currentLang === 'ar';
  document.getElementById('mainTitle').innerHTML = (ar ? cfg.titleAr : cfg.titleEn).replace(/\n/g,'<br>');
  document.getElementById('mainSubtitle').textContent = ar ? cfg.subtitleAr : cfg.subtitleEn;
  document.getElementById('companyBadge').textContent = '🌿 ' + cfg.company;
  document.getElementById('siteFooter').textContent = cfg.footer;
  document.getElementById('searchInput').placeholder = ar ? cfg.searchAr : cfg.searchEn;
  const catsLabel = document.getElementById('catsLabel');
  catsLabel.textContent = ar ? cfg.catsLabelAr : cfg.catsLabelEn;
  catsLabel.style.color = cfg.clrAccentLight;
}

function renderEmergencyBar() {
  const wrap = document.getElementById('emergencyBarWrap');
  if (cfg.emgShow !== 'yes') { wrap.innerHTML = ''; return; }
  const ar = currentLang === 'ar';
  wrap.innerHTML = `
    <div class="emergency-bar" style="background:linear-gradient(90deg,${cfg.clrEmergency},${cfg.clrEmergency}cc)" onclick="openCategory('${cfg.emgTarget}')">
      <span class="e-icon">${cfg.emgIcon}</span>
      <div class="e-text">
        <h3>${ar ? cfg.emgTitleAr : cfg.emgTitleEn}</h3>
        <p>${ar ? cfg.emgSubAr : cfg.emgSubEn}</p>
      </div>
      <span class="e-arrow">${ar?'←':'→'}</span>
    </div>`;
}

// ============================================================
// CATEGORIES GRID
// ============================================================
function renderCatsGrid() {
  const grid = document.getElementById('catsGrid');
  const order = cfg.catOrder || Object.keys(cats);
  const visible = cfg.catVisible || {};
  const ar = currentLang === 'ar';

  grid.innerHTML = order.filter(k => cats[k] && visible[k] !== false).map(k => {
    const c = cats[k];
    return `
    <div class="cat-card" onclick="openCategory('${k}')" style="border-color:transparent">
      <div class="cat-header">
        <div class="cat-icon-wrap" style="background:${c.bgColor}">${c.icon}</div>
        <div>
          <div class="cat-title" style="font-size:${cfg.cardSize}px">${ar?c.titleAr:c.titleEn}</div>
          <div class="cat-subtitle">${ar?c.subtitleAr:c.subtitleEn}</div>
        </div>
      </div>
      <div class="cat-preview">${ar?c.previewAr:c.previewEn}</div>
    </div>`;
  }).join('');
}

// ============================================================
// DETAIL
// ============================================================
function openCategory(key) {
  currentCat = key;
  document.getElementById('homeView').style.display = 'none';
  document.getElementById('detailPanel').classList.add('active');
  const c = cats[key];
  const ar = currentLang === 'ar';
  document.getElementById('detailTitle').textContent = c.icon + ' ' + (ar ? c.titleAr : c.titleEn);
  document.getElementById('detailTitle').style.color = cfg.clrPrimary;
  renderDetail(key);
}

function renderDetail(key) {
  const c = cats[key];
  const ar = currentLang === 'ar';
  document.getElementById('detailBody').innerHTML = c.items.map(item => {
    const val = contentEdits[item.id] !== undefined ? contentEdits[item.id] : item.value;
    return `
    <div class="info-item" style="border-right-color:${cfg.clrAccent}">
      <h3 style="color:${cfg.clrPrimary}"><span>${item.icon}</span> ${ar?item.labelAr:item.labelEn}</h3>
      ${editMode
        ? `<textarea class="editable-field" id="fld_${item.id}" style="border-color:${cfg.clrAccent}">${val}</textarea>
           <div class="edit-hint" style="color:${cfg.clrAccentDark}">✏️ انقر للتعديل</div>`
        : `<p style="white-space:pre-line">${val}</p>`}
    </div>`;
  }).join('');
}

function goBack() {
  document.getElementById('detailPanel').classList.remove('active');
  document.getElementById('homeView').style.display = '';
  clearSearch();
  currentCat = null;
}

// ============================================================
// EDIT MODE (content)
// ============================================================
function toggleEditMode() {
  if (!adminAuthenticated) {
    const pass = prompt('أدخل كلمة مرور التعديل');
    if (pass !== ADMIN_PASSWORD) {
      alert('كلمة المرور غير صحيحة');
      return;
    }
    adminAuthenticated = true;
    document.body.classList.add('admin-unlocked');
  }

  editMode = !editMode;
  document.getElementById('editModeLabel').textContent = editMode ? '✏️ وضع التعديل: مفعّل' : '✏️ وضع التعديل: مُغلق';
  document.getElementById('editToggle').textContent = editMode ? '👁️ معاينة' : '✏️ تعديل';
  const sb = document.getElementById('saveBtn');
  editMode ? sb.classList.add('show') : sb.classList.remove('show');
  if (currentCat) renderDetail(currentCat);
}

function saveContentEdits() {
  if (!adminAuthenticated) { alert('غير مصرح بالتعديل'); return; }
  if (!currentCat) return;
  cats[currentCat].items.forEach(item => {
    const f = document.getElementById('fld_' + item.id);
    if (f) { contentEdits[item.id] = f.value; item.value = f.value; }
  });
  saveState();
  const btn = document.getElementById('saveBtn');
  btn.textContent = '✅ تم';
  setTimeout(() => btn.textContent = '💾 حفظ', 2000);
}

// ============================================================
// SEARCH
// ============================================================
function buildSearchIndex() {
  const idx = [];
  for (const [k,c] of Object.entries(cats)) {
    c.items.forEach(item => {
      idx.push({ catKey:k, catTitle:c.titleAr, icon:item.icon, label:item.labelAr, value:item.value, id:item.id });
    });
  }
  return idx;
}

function handleSearch(val) {
  document.getElementById('searchClear').style.display = val ? 'block' : 'none';
  const box = document.getElementById('suggestionsBox');
  if (!val.trim()) { box.style.display = 'none'; showHome(); return; }
  const idx = buildSearchIndex();
  const results = idx.filter(i => i.label.includes(val) || i.value.includes(val) || i.catTitle.includes(val));
  if (results.length) {
    box.style.display = 'block';
    box.innerHTML = results.slice(0,7).map(r => `
      <div class="suggestion-item" onclick="openCategory('${r.catKey}')">
        <span class="s-icon">${r.icon}</span>
        <span>${r.label}</span>
        <span class="s-cat">${r.catTitle}</span>
      </div>`).join('');
  } else {
    box.style.display = 'none';
  }
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('searchClear').style.display = 'none';
  document.getElementById('suggestionsBox').style.display = 'none';
}

function showHome() {
  document.getElementById('detailPanel').classList.remove('active');
  document.getElementById('homeView').style.display = '';
}

// ============================================================
// LANGUAGE
// ============================================================
function setLang(lang, e) {
  currentLang = lang;
  document.body.classList.toggle('en', lang === 'en');
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.remove('active');
    b.style.background = 'transparent';
    b.style.color = cfg.clrAccentLight;
  });
  if (e && e.target) {
    e.target.classList.add('active');
    e.target.style.background = cfg.clrAccent;
    e.target.style.color = cfg.clrPrimary;
  }
  applyConfig();
}

// ============================================================
// ADMIN PANEL
// ============================================================
function checkAdminPassword() {
  const pass = prompt("أدخل كلمة مرور لوحة التحكم");
  if (pass === ADMIN_PASSWORD) {
    adminAuthenticated = true;
    document.body.classList.add('admin-unlocked');
    openAdmin();
  } else {
    alert("كلمة المرور غير صحيحة");
  }
}

function openAdmin() {
  if (!adminAuthenticated) {
    checkAdminPassword();
    return;
  }
  populateAdmin();
  document.getElementById('adminPanel').classList.add('open');
}

function closeAdmin() {
  document.getElementById('adminPanel').classList.remove('open');
}

function switchTab(id) {
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function populateAdmin() {
  // Site tab
  document.getElementById('cfg-company').value = cfg.company;
  document.getElementById('cfg-logo-icon').value = cfg.logoIcon;
  document.getElementById('cfg-footer').value = cfg.footer;
  document.getElementById('cfg-default-lang').value = cfg.defaultLang;
  document.getElementById('cfg-search-ar').value = cfg.searchAr;
  document.getElementById('cfg-search-en').value = cfg.searchEn;
  // Header
  document.getElementById('cfg-title-ar').value = cfg.titleAr;
  document.getElementById('cfg-title-en').value = cfg.titleEn;
  document.getElementById('cfg-subtitle-ar').value = cfg.subtitleAr;
  document.getElementById('cfg-subtitle-en').value = cfg.subtitleEn;
  document.getElementById('cfg-cats-label-ar').value = cfg.catsLabelAr;
  document.getElementById('cfg-cats-label-en').value = cfg.catsLabelEn;
  // Colors
  document.getElementById('clr-primary').value = cfg.clrPrimary;
  document.getElementById('clr-primary-mid').value = cfg.clrPrimaryMid;
  document.getElementById('clr-accent').value = cfg.clrAccent;
  document.getElementById('clr-accent-light').value = cfg.clrAccentLight;
  document.getElementById('clr-bg').value = cfg.clrBg;
  document.getElementById('clr-search-bg').value = cfg.clrSearchBg;
  document.getElementById('clr-emergency').value = cfg.clrEmergency;
  document.getElementById('clr-text').value = cfg.clrText;
  document.getElementById('cfg-title-size').value = cfg.titleSize;
  document.getElementById('cfg-card-size').value = cfg.cardSize;
  // Emergency
  document.getElementById('cfg-emg-show').value = cfg.emgShow;
  document.getElementById('cfg-emg-icon').value = cfg.emgIcon;
  document.getElementById('cfg-emg-title-ar').value = cfg.emgTitleAr;
  document.getElementById('cfg-emg-sub-ar').value = cfg.emgSubAr;
  document.getElementById('cfg-emg-title-en').value = cfg.emgTitleEn;
  document.getElementById('cfg-emg-sub-en').value = cfg.emgSubEn;
  // Emergency target select
  const emgTarget = document.getElementById('cfg-emg-target');
  emgTarget.innerHTML = Object.keys(cats).map(k => `<option value="${k}" ${cfg.emgTarget===k?'selected':''}>${cats[k].titleAr}</option>`).join('');
  // Cat order
  renderAdminCatOrder();
  // Cat edit select
  const catSel = document.getElementById('catEditSelect');
  catSel.innerHTML = '<option value="">-- اختر --</option>' +
    Object.keys(cats).map(k => `<option value="${k}">${cats[k].icon} ${cats[k].titleAr}</option>`).join('');
}

function renderAdminCatOrder() {
  const list = document.getElementById('catOrderList');
  const order = cfg.catOrder || Object.keys(cats);
  const visible = cfg.catVisible || {};
  list.innerHTML = order.map((k,i) => {
    if (!cats[k]) return '';
    const c = cats[k];
    const isVis = visible[k] !== false;
    return `
    <li class="cat-order-item" draggable="true" data-key="${k}"
      ondragstart="dragStart(event,${i})" ondragover="dragOver(event)" ondrop="dropItem(event,${i})">
      <span class="drag-handle">⠿</span>
      <span>${c.icon} ${c.titleAr}</span>
      <button class="cat-vis-toggle ${isVis?'visible':''}" onclick="toggleCatVis('${k}',this)">
        ${isVis?'👁️ ظاهر':'🙈 مخفي'}
      </button>
    </li>`;
  }).join('');
}

function toggleCatVis(key, btn) {
  if (!cfg.catVisible) cfg.catVisible = {};
  cfg.catVisible[key] = cfg.catVisible[key] === false ? true : false;
  btn.classList.toggle('visible', cfg.catVisible[key] !== false);
  btn.textContent = cfg.catVisible[key] !== false ? '👁️ ظاهر' : '🙈 مخفي';
}

// Drag & Drop
let dragIdx = null;
function dragStart(e, i) { dragIdx = i; e.dataTransfer.effectAllowed = 'move'; }
function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function dropItem(e, i) {
  e.preventDefault();
  if (dragIdx === null || dragIdx === i) return;
  const arr = [...(cfg.catOrder || Object.keys(cats))];
  const [moved] = arr.splice(dragIdx, 1);
  arr.splice(i, 0, moved);
  cfg.catOrder = arr;
  dragIdx = null;
  renderAdminCatOrder();
}

// Cat content edit
function loadCatEdit() {
  const key = document.getElementById('catEditSelect').value;
  const area = document.getElementById('catEditFields');
  if (!key) { area.innerHTML = ''; return; }
  const c = cats[key];
  area.innerHTML = `
    <div class="admin-field"><label>أيقونة القسم</label><input id="ce-icon" value="${c.icon}"></div>
    <div class="admin-field"><label>لون خلفية الأيقونة</label><input type="color" id="ce-bg" value="${c.bgColor}"></div>
    <div class="admin-field"><label>العنوان (عربي)</label><input id="ce-title-ar" value="${c.titleAr}"></div>
    <div class="admin-field"><label>العنوان (إنجليزي)</label><input id="ce-title-en" value="${c.titleEn}"></div>
    <div class="admin-field"><label>العنوان الفرعي (عربي)</label><input id="ce-sub-ar" value="${c.subtitleAr}"></div>
    <div class="admin-field"><label>العنوان الفرعي (إنجليزي)</label><input id="ce-sub-en" value="${c.subtitleEn}"></div>
    <div class="admin-field"><label>نص المعاينة (عربي)</label><input id="ce-prev-ar" value="${c.previewAr}"></div>
    <div class="admin-field"><label>نص المعاينة (إنجليزي)</label><input id="ce-prev-en" value="${c.previewEn}"></div>
    <hr style="border-color:rgba(255,255,255,0.1);margin:12px 0">
    <p style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:8px;">محتوى العناصر — عدّل القيم مباشرة:</p>
    ${c.items.map(item => `
    <div class="admin-field" style="background:#0a0a1a;padding:10px;border-radius:8px;margin-bottom:8px;">
      <label>${item.icon} ${item.labelAr}</label>
      <textarea id="ci_${item.id}" style="min-height:60px">${contentEdits[item.id]!==undefined?contentEdits[item.id]:item.value}</textarea>
    </div>`).join('')}
    <button onclick="saveCatEdit('${key}')" style="background:var(--accent);color:#0D3B2E;border:none;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:Tajawal,sans-serif;width:100%;margin-top:6px">💾 حفظ هذا القسم</button>
  `;
}

function saveCatEdit(key) {
  const c = cats[key];
  c.icon = document.getElementById('ce-icon').value;
  c.bgColor = document.getElementById('ce-bg').value;
  c.titleAr = document.getElementById('ce-title-ar').value;
  c.titleEn = document.getElementById('ce-title-en').value;
  c.subtitleAr = document.getElementById('ce-sub-ar').value;
  c.subtitleEn = document.getElementById('ce-sub-en').value;
  c.previewAr = document.getElementById('ce-prev-ar').value;
  c.previewEn = document.getElementById('ce-prev-en').value;
  c.items.forEach(item => {
    const f = document.getElementById('ci_' + item.id);
    if (f) { contentEdits[item.id] = f.value; item.value = f.value; }
  });
  saveState();
  alert('✅ تم حفظ القسم');
}

function applyAndSave() {
  cfg.company = document.getElementById('cfg-company').value;
  cfg.logoIcon = document.getElementById('cfg-logo-icon').value;
  cfg.footer = document.getElementById('cfg-footer').value;
  cfg.defaultLang = document.getElementById('cfg-default-lang').value;
  cfg.searchAr = document.getElementById('cfg-search-ar').value;
  cfg.searchEn = document.getElementById('cfg-search-en').value;
  cfg.titleAr = document.getElementById('cfg-title-ar').value;
  cfg.titleEn = document.getElementById('cfg-title-en').value;
  cfg.subtitleAr = document.getElementById('cfg-subtitle-ar').value;
  cfg.subtitleEn = document.getElementById('cfg-subtitle-en').value;
  cfg.catsLabelAr = document.getElementById('cfg-cats-label-ar').value;
  cfg.catsLabelEn = document.getElementById('cfg-cats-label-en').value;
  cfg.clrPrimary = document.getElementById('clr-primary').value;
  cfg.clrPrimaryMid = document.getElementById('clr-primary-mid').value;
  cfg.clrAccent = document.getElementById('clr-accent').value;
  cfg.clrAccentLight = document.getElementById('clr-accent-light').value;
  cfg.clrBg = document.getElementById('clr-bg').value;
  cfg.clrSearchBg = document.getElementById('clr-search-bg').value;
  cfg.clrEmergency = document.getElementById('clr-emergency').value;
  cfg.clrText = document.getElementById('clr-text').value;
  cfg.titleSize = +document.getElementById('cfg-title-size').value;
  cfg.cardSize = +document.getElementById('cfg-card-size').value;
  cfg.emgShow = document.getElementById('cfg-emg-show').value;
  cfg.emgIcon = document.getElementById('cfg-emg-icon').value;
  cfg.emgTitleAr = document.getElementById('cfg-emg-title-ar').value;
  cfg.emgSubAr = document.getElementById('cfg-emg-sub-ar').value;
  cfg.emgTitleEn = document.getElementById('cfg-emg-title-en').value;
  cfg.emgSubEn = document.getElementById('cfg-emg-sub-en').value;
  cfg.emgTarget = document.getElementById('cfg-emg-target').value;
  saveState();
  applyConfig();
  closeAdmin();
}

function resetColors() {
  if (!confirm('هل تريد إعادة الألوان الافتراضية؟')) return;
  ['clrPrimary','clrPrimaryMid','clrAccent','clrAccentLight','clrBg','clrSearchBg','clrEmergency','clrText'].forEach(k => {
    document.getElementById('clr-' + k.replace('clr','').replace(/([A-Z])/g,'-$1').toLowerCase().replace(/^-/,'')).value = DEFAULT_CFG[k] || '#000000';
  });
  document.getElementById('clr-primary').value = DEFAULT_CFG.clrPrimary;
  document.getElementById('clr-primary-mid').value = DEFAULT_CFG.clrPrimaryMid;
  document.getElementById('clr-accent').value = DEFAULT_CFG.clrAccent;
  document.getElementById('clr-accent-light').value = DEFAULT_CFG.clrAccentLight;
  document.getElementById('clr-bg').value = DEFAULT_CFG.clrBg;
  document.getElementById('clr-search-bg').value = DEFAULT_CFG.clrSearchBg;
  document.getElementById('clr-emergency').value = DEFAULT_CFG.clrEmergency;
  document.getElementById('clr-text').value = DEFAULT_CFG.clrText;
}

// Close suggestions on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) document.getElementById('suggestionsBox').style.display = 'none';
});

// ============================================================
// INIT
// ============================================================
loadState();
currentLang = cfg.defaultLang || 'ar';
if (currentLang === 'en') document.body.classList.add('en');
applyConfig();
</script>
</body>
